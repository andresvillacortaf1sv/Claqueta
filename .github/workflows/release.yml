name: Compilar instaladores (macOS, Windows, Linux)

# Se dispara al publicar una etiqueta de versión, p. ej. v0.20.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # también permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # genera .dmg y .app (universal: Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
          - platform: windows-latest # genera .msi y .exe
            args: ""
          - platform: ubuntu-22.04 # genera .AppImage y .deb
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Compilar y publicar instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Claqueta ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
